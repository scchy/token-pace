name: TokenPace Morning Brief

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run TokenPace from the upstream repository
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CUSTOM_PLAN_TOKEN: ${{ secrets.CUSTOM_PLAN_TOKEN }}
          KIM_CODE_API_KEY: ${{ secrets.KIM_CODE_API_KEY }}
          GLM_TOKEN_PLAN_API_KEY: ${{ secrets.GLM_TOKEN_PLAN_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_USER_ID: ${{ secrets.FEISHU_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        run: |
          if [ ! -f plans.toml ]; then
            echo "plans.toml not found; add your configuration before running."
            exit 0
          fi
          uvx --python 3.11 --from git+https://github.com/scchy/token-pace.git tokenpace --config plans.toml

      - name: Persist ledger.jsonl
        if: always()
        run: |
          if [ ! -f data/ledger.jsonl ]; then
            exit 0
          fi
          git config user.name "tokenpace-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/ledger.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore: update usage ledger [skip ci]"
            git pull --rebase
            git push
          fi
