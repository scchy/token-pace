[general]
locale = "en"
timezone = "Asia/Shanghai"
ledger_path = "data/ledger.jsonl"
workdays_only = false
pacing_mode = "auto"
timeout = 10

# Keep only the plans you use and set total_quota to your actual budget.
[[plans]]
id = "openrouter"
name = "OpenRouter API"
provider = "openrouter"
unit = "USD"
total_quota = 100.0
reset_cycle = "monthly:1"

[plans.auth]
api_key = "${OPENROUTER_API_KEY}"

# Direct Card 2.0 delivery without a group. Store all three values as Actions Secrets.
# FEISHU_USER_ID must be the recipient open_id issued by this specific app.
[[notifiers]]
type = "feishu_app"
app_id = "${FEISHU_APP_ID}"
app_secret = "${FEISHU_APP_SECRET}"
user_id = "${FEISHU_USER_ID}"
