[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tokenpace"
version = "0.2.0"
description = "Your AI token quota pacer and daily morning brief"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TokenPace contributors" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
tokenpace = "tokenpace.cli:main"
token-pace = "tokenpace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenpace"]
